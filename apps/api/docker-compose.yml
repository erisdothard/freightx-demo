# FreightX API — Docker Compose
#
# INTERVIEW NOTE: docker-compose is for local dev and simple deployments.
# For production at scale, you'd use Kubernetes, ECS, or Cloud Run.
# But compose is great for: local dev, CI/CD, small deployments.
#
# Usage:
#   docker compose up          # start
#   docker compose up --build  # rebuild + start
#   docker compose down        # stop

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
    # INTERVIEW NOTE: healthcheck in compose mirrors the Dockerfile HEALTHCHECK.
    # Compose uses it for `depends_on` with `condition: service_healthy`.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
